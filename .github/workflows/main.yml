name: Build APK (Full English)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Translate All Hardcoded Chinese Strings to English
        run: |
          cp -f app/src/main/res/values-en/strings.xml app/src/main/res/values/strings.xml
          cp -f feature/editor/src/main/res/values-en/strings.xml feature/editor/src/main/res/values/strings.xml
          cp -f feature/preview/src/main/res/values-en/strings.xml feature/preview/src/main/res/values/strings.xml
          python3 - << 'EOF'
          import os
          replacements = [
              ('title = { Text("预览") }', 'title = { Text("Preview") }'),
              ('contentDescription = "返回"', 'contentDescription = "Back"'),
              ('Text("未挂载视频", color = Color.White)', 'Text("No video attached", color = Color.White)'),
              ('Button(onClick = onPickVideo) { Text("选择视频") }', 'Button(onClick = onPickVideo) { Text("Pick Video") }'),
              ('"可视化打字：拖拽设 \\\\pos"', '"Visual Typesetting: Drag to set \\\\pos"'),
              ('"可视化打字：拖拽起点(绿)/终点(橙)设 \\\\move"', '"Visual Typesetting: Drag start (green) / end (orange) to set \\\\move"'),
              ('Text("波形")', 'Text("Waveform")'),
              ('Text("频谱")', 'Text("Spectrogram")'),
              ('Text("书签",', 'Text("Bookmarks",'),
              ('Text("加书签（当前位）")', 'Text("Add Bookmark (Current)")'),
              ('Text("加书签")', 'Text("Add Bookmark")'),
              ('Text("暂无书签",', 'Text("No bookmarks yet",'),
              ('"书签 ${formatTime(bm.timeMs)}"', '"Bookmark ${formatTime(bm.timeMs)}"'),
              ('Text("跳转")', 'Text("Jump")'),
              ('Text("删除")', 'Text("Delete")'),
              ('Text("Karaoke 计时",', 'Text("Karaoke Timing",'),
              ('label = { Text("\\\\pos 定位") }', 'label = { Text("\\\\pos Position") }'),
              ('label = { Text("\\\\move 移动") }', 'label = { Text("\\\\move Movement") }'),
              ('if (toolMode == VisualToolMode.MOVE) "清 \\\\move" else "清 \\\\pos"', 'if (toolMode == VisualToolMode.MOVE) "Clear \\\\move" else "Clear \\\\pos"'),
              ('label = { Text("淡入 ms") }', 'label = { Text("Fade-in ms") }'),
              ('label = { Text("淡出 ms") }', 'label = { Text("Fade-out ms") }'),
              ('Text("应用")', 'Text("Apply")'),
              ('label = { Text("\\\\clip 显示区内") }', 'label = { Text("\\\\clip Inside") }'),
              ('label = { Text("\\\\iclip 反向") }', 'label = { Text("\\\\iclip Invert") }'),
              ('Text("清除")', 'Text("Clear")'),
              ('contentDescription = "播放/暂停"', 'contentDescription = "Play/Pause"'),
              ('contentDescription = "撤销"', 'contentDescription = "Undo"'),
              ('contentDescription = "重做"', 'contentDescription = "Redo"'),
              ('contentDescription = "上一行"', 'contentDescription = "Previous Line"'),
              ('contentDescription = "下一行"', 'contentDescription = "Next Line"'),
              ('Text("设起始")', 'Text("Set Start")'),
              ('Text("设结束")', 'Text("Set End")'),
              ('if (showSpectrogram) "波形" else "频谱"', 'if (showSpectrogram) "Waveform" else "Spectrogram"'),
              ('if (vtActive) "退出打字" else "打字"', 'if (vtActive) "Exit Typeset" else "Typeset"'),
