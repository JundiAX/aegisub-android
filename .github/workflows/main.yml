          for root, _, files in os.walk('.'):
              if '/src/main/' in root.replace('\\', '/'):
                  for f in files:
                      if f.endswith('.kt'):
                          p = os.path.join(root, f)
                          with open(p, 'r', encoding='utf-8') as fp: c = fp.read()
                          for o, n in replacements: c = c.replace(o, n)
                          with open(p, 'w', encoding='utf-8') as fp: fp.write(c)
