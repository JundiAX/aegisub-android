              ('contentDescription = "预览"', 'contentDescription = "Preview"'),
              ('TextButton(onClick = onExport) { Text("导出") }', 'TextButton(onClick = onExport) { Text("Export") }'),
              ('label = { Text("查找") }', 'label = { Text("Find") }'),
              ('label = { Text("替换为") }', 'label = { Text("Replace with") }'),
